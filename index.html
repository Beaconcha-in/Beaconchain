<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="gobitfly.xyz – part of the Horizon ecosystem. Open-source Ethereum infrastructure tools.">
    <title>gobitfly.xyz | Horizon Ecosystem</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: radial-gradient(ellipse at 20% 30%, #0a0c18, #010104);
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #eef2ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 1rem;
        }
        .container {
            max-width: 600px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            border: 1px solid rgba(79, 158, 255, 0.25);
            padding: 2.5rem 2rem;
            box-shadow: 0 15px 35px -12px rgba(0,0,0,0.4);
        }
        h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #fff, #4f9eff, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.1rem;
            color: #bfd6ff;
            margin-bottom: 2rem;
        }
        .links {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        a {
            text-decoration: none;
            color: #eef2ff;
            background: rgba(79, 158, 255, 0.15);
            border: 1px solid #4f9eff55;
            padding: 0.5rem 1.2rem;
            border-radius: 60px;
            font-size: 0.9rem;
            transition: 0.3s;
        }
        a:hover {
            background: #4f9eff;
            border-color: #4f9eff;
            transform: translateY(-2px);
        }
        .footer {
            margin-top: 2.5rem;
            font-size: 0.7rem;
            color: #8ba0d0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔭 gobitfly.xyz</h1>
        <p>Part of the <strong>Horizon Ecosystem</strong> – open-source tools for Ethereum infrastructure.</p>
        <div class="links">
            <a href="https://beaconchain.us">Beaconchain.us</a>
            <a href="https://github.com/beaconchain-us">GitHub Org</a>
            <a href="https://beaconchain-horizon.github.io/hub">Horizon Hub</a>
        </div>
        <div class="footer">
            © 2026 Horizon Ecosystem · gobitfly.xyz
        </div>
    </div>
</body>
</html>
